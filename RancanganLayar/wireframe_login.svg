<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background-color: #F3F4F6; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Background -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
  <!-- Main Card -->
  <rect x="520" y="80" width="400" height="680" rx="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  
  <!-- App Icon Placeholder -->
  <rect x="680" y="120" width="80" height="80" rx="20" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="704" y="144" width="32" height="32" rx="4" fill="none" stroke="#9CA3AF" stroke-width="3"/>
  <line x1="720" y1="144" x2="720" y2="176" stroke="#9CA3AF" stroke-width="3"/>
  <line x1="704" y1="156" x2="736" y2="156" stroke="#9CA3AF" stroke-width="3"/>

  <!-- Title & Subtitle -->
  <text x="720" y="245" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Sistem Pakar</text>
  <text x="720" y="270" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280">Diagnosa Kerusakan Case Based Expert System</text>

  <!-- Username Field -->
  <text x="560" y="325" font-size="11" font-weight="700" fill="#4B5563" letter-spacing="1">USERNAME</text>
  <rect x="560" y="335" width="320" height="48" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <!-- User Icon -->
  <circle cx="584" cy="353" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <path d="M576 367 C576 361, 592 361, 592 367" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
  <text x="604" y="364" font-size="13" fill="#9CA3AF">Masukkan username...</text>

  <!-- Password Field -->
  <text x="560" y="415" font-size="11" font-weight="700" fill="#4B5563" letter-spacing="1">PASSWORD</text>
  <rect x="560" y="425" width="320" height="48" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <!-- Lock Icon -->
  <rect x="577" y="449" width="14" height="10" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <path d="M580 449 V444 C580 440, 588 440, 588 444 V449" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="604" y="454" font-size="13" fill="#9CA3AF">Masukkan password...</text>
  <!-- Eye Icon -->
  <path d="M848 449 C848 449, 853 443, 858 443 C863 443, 868 449, 868 449 C868 449, 863 455, 858 455 C853 455, 848 449, 848 449 Z" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <circle cx="858" cy="449" r="2" fill="#9CA3AF"/>

  <!-- Button -->
  <rect x="560" y="505" width="320" height="48" rx="8" fill="#111827"/>
  <text x="720" y="534" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Masuk</text>

  <!-- Divider -->
  <line x1="560" y1="590" x2="670" y2="590" stroke="#E5E7EB" stroke-width="1"/>
  <text x="720" y="594" text-anchor="middle" font-size="11" fill="#6B7280">Akun Default</text>
  <line x1="770" y1="590" x2="880" y2="590" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Info Box -->
  <rect x="560" y="620" width="320" height="100" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="580" y="650" font-size="13" fill="#374151"><tspan font-weight="700">Admin:</tspan> admin / admin123</text>
  <text x="580" y="675" font-size="13" fill="#374151"><tspan font-weight="700">User:</tspan> user / user123</text>
  
  <text x="580" y="700" font-size="11" fill="#4B5563" text-decoration="underline">→ Isi akun admin</text>
  <text x="680" y="700" font-size="11" fill="#4B5563" text-decoration="underline">→ Isi akun user</text>

  <!-- Footer -->
  <text x="720" y="800" text-anchor="middle" font-size="12" fill="#9CA3AF">© 2026 Sistem Pakar Diagnosa Kerusakan</text>
</svg>
